templates:
  - language: go
    name: cli
    dirs:
      - cmd
      - pkg
      - internal
    files:
      - path: main.go
        content: |
          package main

          import "fmt"

          func main() {
          	fmt.Println("Nova CLI project initialized")
          }
      - path: go.mod
        content: |
          module myproject

          go 1.21
      - path: .gitignore
        content: |
          *.exe
          *.exe~
          bin/
          dist/

  - language: go
    name: api
    dirs:
      - api
      - controllers
      - models
      - routes
    files:
      - path: main.go
        content: |
          package main

          import (
          	"fmt"
          	"net/http"
          )

          func main() {
          	http.HandleFunc("/health", func(w http.ResponseWriter, r *http.Request) {
          		fmt.Fprintln(w, `{"status":"ok"}`)
          	})
          	fmt.Println("API server listening on :8080...")
          	_ = http.ListenAndServe(":8080", nil)
          }
      - path: go.mod
        content: |
          module myapi

          go 1.21
      - path: .gitignore
        content: |
          bin/
          *.exe

  - language: node
    name: express
    dirs:
      - routes
      - controllers
      - middleware
    files:
      - path: package.json
        content: |
          {
            "name": "express-api",
            "version": "1.0.0",
            "main": "index.js",
            "scripts": {
              "start": "node index.js",
              "dev": "node --watch index.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            }
          }
      - path: index.js
        content: |
          const express = require('express');
          const app = express();
          const PORT = process.env.PORT || 3000;

          app.use(express.json());

          app.get('/', (req, res) => {
            res.json({ message: 'Welcome to Express API!' });
          });

          app.get('/health', (req, res) => {
            res.json({ status: 'ok' });
          });

          app.listen(PORT, () => {
            console.log('Server running on http://localhost:' + PORT);
          });
      - path: .gitignore
        content: |
          node_modules/
          .env
          *.log

  - language: next.js
    name: default
    dirs:
      - app
      - public
    files:
      - path: package.json
        content: |
          {
            "name": "nextjs-app",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "dev": "next dev",
              "build": "next build",
              "start": "next start"
            },
            "dependencies": {
              "next": "^14.0.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            }
          }
      - path: app/page.js
        content: |
          export default function Home() {
            return (
              <main style={{ padding: '2rem', fontFamily: 'sans-serif' }}>
                <h1>Welcome to Next.js!</h1>
                <p>Scaffolded with Nova CLI.</p>
              </main>
            );
          }
      - path: app/layout.js
        content: |
          export const metadata = {
            title: 'Next.js App',
            description: 'Generated by Nova',
          };

          export default function RootLayout({ children }) {
            return (
              <html lang="en">
                <body>{children}</body>
              </html>
            );
          }
      - path: .gitignore
        content: |
          node_modules/
          .next/
          out/
          .env.local

  - language: vite
    name: react
    dirs:
      - src
      - public
    files:
      - path: package.json
        content: |
          {
            "name": "vite-react-app",
            "private": true,
            "version": "0.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.2.0",
              "vite": "^5.0.0"
            }
          }
      - path: index.html
        content: |
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Vite + React</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
      - path: src/main.jsx
        content: |
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.jsx'

          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          )
      - path: src/App.jsx
        content: |
          import React from 'react'

          export default function App() {
            return (
              <div style={{ fontFamily: 'sans-serif', padding: '20px' }}>
                <h1>Vite + React App</h1>
                <p>Scaffolded with Nova CLI.</p>
              </div>
            )
          }
      - path: vite.config.js
        content: |
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
          })
      - path: .gitignore
        content: |
          node_modules/
          dist/
          .env

